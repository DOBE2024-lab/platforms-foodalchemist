name: Suite

# Volle Modul-Suite (--testsuite=FoodAlchemist) für eine Sammel-Charge, verteilt auf Runner-Shards.
# Läuft NUR im Fork und nur von Hand (workflow_dispatch). Das Original bekommt keinen Workflow.
#
# Aufbau: Dieser Branch (ci/suite) liefert nur die Werkzeuge (ci/host = schlanke Laravel-Host-App,
# ci/zusammenfassung.py). Das Modul wird auf `ref` ausgecheckt — gesucht zuerst im Original
# (martin3r-me), dann im Fork (dorthin pusht Paul die Sammel-Branches). origin/main zeigt auf das
# Original, damit die BaselineKlinke dieselbe merge-base sieht wie lokal.
# Die Geschwister-Module kommen vom main des Originals; ihre SHAs werden EINMAL im Job
# „vorbereiten" festgelegt, damit alle Shards dieselben Stände testen.
# Alle beteiligten Repos sind öffentlich — kein Secret nötig.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch oder SHA des Moduls (Original oder Fork)'
        required: true
        default: main
      shards:
        description: 'Anzahl Shards (je Shard parallel über alle Kerne des Runners, ubuntu-latest: 4)'
        required: true
        default: '12'

concurrency:
  group: suite-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORIGINAL: martin3r-me
  WS: ${{ github.workspace }}/ws

jobs:
  vorbereiten:
    name: Stände festlegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modul_sha: ${{ steps.modul.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.liste }}
      geschwister: ${{ steps.geschwister.outputs.json }}
    steps:
      - name: Modul-Ref auflösen
        id: modul
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git init -q m && cd m
          git remote add origin "https://github.com/${ORIGINAL}/platforms-foodalchemist.git"
          git remote add fork "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q --filter=blob:none fork '+refs/heads/*:refs/remotes/fork/*' || true
          sha=""
          for k in "origin/$REF" "fork/$REF" "$REF"; do
            if s=$(git rev-parse -q --verify "$k^{commit}" 2>/dev/null); then sha=$s; echo "ref $REF → $k → $sha"; break; fi
          done
          [ -n "$sha" ] || { echo "::error::Ref '$REF' weder im Original noch im Fork gefunden"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Geschwister-SHAs (main des Originals)
        id: geschwister
        run: |
          set -euo pipefail
          json="{"
          for r in platforms-core platform-crm platforms-organization platforms-notifications platforms-integrations platforms-activity-log platforms-ui-tailwind; do
            s=$(git ls-remote "https://github.com/${ORIGINAL}/$r.git" refs/heads/main | cut -f1)
            [ -n "$s" ] || { echo "::error::$r: main nicht gefunden"; exit 1; }
            json="$json\"$r\":\"$s\","
          done
          echo "json=${json%,}}" >> "$GITHUB_OUTPUT"

      - name: Shard-Liste
        id: matrix
        env:
          N: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -ge 1 ] && [ "$N" -le 20 ] || { echo "::error::shards muss 1–20 sein"; exit 1; }
          echo "liste=[$(seq -s, 1 "$N")]" >> "$GITHUB_OUTPUT"

  test:
    name: Shard ${{ matrix.shard }}/${{ inputs.shards }}
    needs: vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 150   # Account: nur 5 Jobs gleichzeitig, Shards laufen in Wellen
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.vorbereiten.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
      MODUL_SHA: ${{ needs.vorbereiten.outputs.modul_sha }}
      GESCHWISTER: ${{ needs.vorbereiten.outputs.geschwister }}
    steps:
      - name: Werkzeuge (ci/suite)
        uses: actions/checkout@v4
        with:
          path: werkzeug
          sparse-checkout: ci

      - name: Modul und Geschwister holen
        run: |
          set -euo pipefail
          hole() {   # hole <repo> <ziel> <sha>
            git init -q "$WS/$2"
            git -C "$WS/$2" remote add origin "https://github.com/${ORIGINAL}/$1.git"
            git -C "$WS/$2" fetch -q --depth 1 origin "$3"
            git -C "$WS/$2" checkout -q -B main FETCH_HEAD   # Branch „main“: Composer liest die Version des Pfad-Pakets daraus (sonst dev-<sha> ≠ dev-main)
          }
          # Modul: Teil-Klon mit voller Historie (BaselineKlinke: merge-base HEAD origin/main)
          M="$WS/platform/modules/platforms-foodalchemist"
          git clone -q --filter=blob:none --no-checkout "https://github.com/${ORIGINAL}/platforms-foodalchemist.git" "$M"
          if ! git -C "$M" cat-file -e "$MODUL_SHA^{commit}" 2>/dev/null; then
            git -C "$M" remote add fork "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$M" fetch -q --filter=blob:none fork '+refs/heads/*:refs/remotes/fork/*'
          fi
          git -C "$M" checkout -q -B main "$MODUL_SHA"     # s. o.; origin/main bleibt das Original (BaselineKlinke)
          for r in platforms-core platform-crm platforms-organization platforms-notifications platforms-integrations platforms-activity-log; do
            hole "$r" "platform/modules/$r" "$(jq -r --arg r "$r" '.[$r]' <<<"$GESCHWISTER")"
          done
          hole platforms-ui-tailwind styles/platforms-ui-tailwind "$(jq -r '."platforms-ui-tailwind"' <<<"$GESCHWISTER")"

      - name: Host anlegen
        run: |
          set -euo pipefail
          cp -R werkzeug/ci/host "$WS/host"
          cd "$WS/host"
          mkdir -p storage/framework/{cache/data,sessions,views,testing} storage/logs storage/app/public bootstrap/cache
          printf '%s\n' 'APP_NAME=Laravel' 'APP_ENV=testing' 'APP_KEY=' 'APP_DEBUG=true' \
            'APP_LOCALE=en' 'APP_FALLBACK_LOCALE=en' 'APP_FAKER_LOCALE=en_US' \
            'LOG_CHANNEL=stack' "AUTH_MODEL='Platform\\Core\\Models\\User'" \
            'FOODALCHEMIST_AI_PROVIDER=fake' \
            'DB_CONNECTION=sqlite' 'DB_DATABASE=:memory:' > .env   # package:discover fragt die DB ab (core: Tabelle modules)

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('werkzeug/ci/host/composer.lock') }}-${{ needs.vorbereiten.outputs.modul_sha }}
          restore-keys: composer-${{ hashFiles('werkzeug/ci/host/composer.lock') }}-

      - name: Abhängigkeiten installieren
        working-directory: ws/host
        run: |
          # Lock hält Laravel/Pest fest; die martin3r-Pfadpakete samt ihren Abhängigkeiten
          # werden frisch aufgelöst (die Module wachsen schneller als das Lock).
          composer update 'martin3r/*' --with-dependencies --no-interaction --no-progress --prefer-dist
          php artisan key:generate --ansi

      - name: Pest Shard ${{ matrix.shard }}/${{ inputs.shards }}
        working-directory: ws/host
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
        # Aufteilung selbst (ci/shard_dateien.py) statt `pest --shard`: Pests Testliste erkennt nur Klassen
        # im Namespace Tests\… — bei den Modultests bliebe sie leer, jeder Shard liefe die ganze Suite.
        # Kein --processes: --parallel nimmt ohne Angabe die Kernzahl des Runners.
        run: |
          set -o pipefail
          echo "nproc=$(nproc)  php=$(php -r 'echo PHP_VERSION;')  xdebug=$(php -m | grep -ci xdebug)  pcov=$(php -m | grep -ci pcov)"
          # phpunit-shard.xml = phpunit.xml, die Suite FoodAlchemist listet nur die Dateien dieses Shards
          python3 "$GITHUB_WORKSPACE/werkzeug/ci/shard_dateien.py" \
            "$WS/platform/modules/platforms-foodalchemist/tests" "$SHARD" "$SHARDS" vendor/martin3r/platform-foodalchemist/tests \
            --phpunit phpunit.xml phpunit-shard.xml --listen .
          php -d memory_limit=1G vendor/bin/pest \
            --configuration=phpunit-shard.xml --testsuite=FoodAlchemist \
            --parallel \
            --log-junit="junit-${SHARD}.xml" 2>&1 | tee "pest-${SHARD}.log"

      - name: Vorlagen-Zähler
        if: always()
        working-directory: ws/host
        # Test-DB-Vorlage (tests/Support/TestDbVorlage): je Worker-Prozess eine Zeile geladen/gebaut/alt. Ohne die
        # Vorlage im getesteten Stand bleibt die Datei leer.
        run: |
          cat "$(php -r 'echo sys_get_temp_dir();')"/fa-test-vorlage/zaehler-*.log > "vorlage-${SHARD}.log" 2>/dev/null || true
          cat "vorlage-${SHARD}.log"

      - name: Ergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            ws/host/junit-${{ matrix.shard }}.xml
            ws/host/pest-${{ matrix.shard }}.log
            ws/host/dateien-${{ matrix.shard }}.txt
            ws/host/soll-${{ matrix.shard }}.txt
            ws/host/vorlage-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 14

  zusammenfassung:
    name: Zusammenfassung
    needs: [vorbereiten, test]
    if: always() && needs.vorbereiten.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARDS: ${{ inputs.shards }}
      REF: ${{ inputs.ref }}
      MODUL_SHA: ${{ needs.vorbereiten.outputs.modul_sha }}
      GESCHWISTER: ${{ needs.vorbereiten.outputs.geschwister }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: ergebnisse
      - name: Bericht
        run: python3 ci/zusammenfassung.py ergebnisse "${{ needs.test.result }}" | tee bericht.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bericht sichern
        uses: actions/upload-artifact@v4
        with:
          name: bericht
          path: bericht.md
          retention-days: 30
      - name: Gesamturteil
        run: python3 ci/zusammenfassung.py ergebnisse "${{ needs.test.result }}" --pruefen
